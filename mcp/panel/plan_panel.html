<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TripPlanner 行程面板 · M3</title>
<style>
  :root{
    --bg:#ffffff; --panel:#f7f8fa; --line:#e3e6ea; --ink:#1b1f24; --muted:#666e78;
    --ok:#0f6e56; --okbg:#e1f5ee; --warn:#854f0b; --warnbg:#faeeda; --bad:#a32d2d; --badbg:#fcebeb;
    --blue:#185fa5; --bluebg:#e6f1fb;
  }
  *{box-sizing:border-box}
  body{
    margin:0;padding:16px 18px 24px;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;font-size:13px;line-height:1.6;
  }
  h1{font-size:16px;font-weight:600;margin:0 0 4px}
  h2{font-size:13px;font-weight:600;margin:0 0 8px}
  .sub{color:var(--muted);font-size:12px;margin-bottom:14px}
  .tag{display:inline-block;padding:1px 7px;border-radius:10px;background:var(--bluebg);color:var(--blue);font-size:11px;font-weight:500;vertical-align:2px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
  .row{display:flex;gap:8px;align-items:baseline;margin:3px 0}
  .k{color:var(--muted);min-width:120px;flex:0 0 120px}
  .v{font-family:ui-monospace,Consolas,monospace;font-size:12px;word-break:break-all}
  .badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:500;margin-right:4px}
  .b-idle{background:var(--panel);color:var(--muted);border:1px solid var(--line)}
  .b-run{background:var(--warnbg);color:var(--warn)}
  .b-ok{background:var(--okbg);color:var(--ok)}
  .b-bad{background:var(--badbg);color:var(--bad)}
  .b-blue{background:var(--bluebg);color:var(--blue)}
  button{font:inherit;font-size:12px;padding:6px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
  button:hover:not(:disabled){border-color:#b8bec6}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  #log{margin:8px 0 0;padding:9px 11px;background:#1b1f24;color:#d8dee6;border-radius:8px;
       font-family:ui-monospace,Consolas,monospace;font-size:11px;line-height:1.5;
       max-height:190px;overflow:auto;white-space:pre-wrap;word-break:break-all}
  .hint{color:var(--muted);font-size:11px;margin-top:6px}
  code{background:#eceff3;padding:1px 5px;border-radius:4px;font-size:11.5px}

  /* ---- 行程区 ---- */
  .head{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:2px}
  .head .city{font-size:15px;font-weight:600}
  .metrics{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:12px;color:var(--muted)}
  .metrics b{color:var(--ink);font-weight:600}
  .day{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
  .day-h{background:var(--panel);padding:9px 12px;border-bottom:1px solid var(--line)}
  .day-h .t{font-weight:600;font-size:13px}
  .day-h .meta{color:var(--muted);font-size:11.5px;margin-top:2px}
  .day-b{padding:8px 12px 10px}
  .tl{list-style:none;margin:0;padding:0}
  .tl li{display:flex;gap:10px;padding:5px 0;border-bottom:1px dashed #eef0f3;align-items:flex-start}
  .tl li:last-child{border-bottom:0}
  .time{flex:0 0 124px;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:var(--muted);padding-top:1px}
  .dur{font-style:normal;color:#98a1ac;font-size:10.5px;margin-left:4px}
  .body{flex:1 1 auto;min-width:0}
  .nm{font-weight:500}
  .hop .nm{color:var(--muted);font-weight:400;font-size:12px}
  .meal .nm{color:var(--warn);font-weight:500;font-size:12px}
  .thumb{width:44px;height:44px;border-radius:6px;object-fit:cover;flex:0 0 44px;border:1px solid var(--line)}
  .sub-reason{color:var(--muted);font-size:11.5px;margin-top:6px;padding-top:6px;border-top:1px solid #eef0f3}
  .drop{margin-top:8px;padding:8px 10px;background:var(--badbg);border-radius:8px;font-size:11.5px;color:#5f2020}
  .viol{margin-top:8px;padding:8px 10px;background:var(--warnbg);border-radius:8px;font-size:11.5px;color:#5c3a08}
  .empty{color:var(--muted);font-size:12px;padding:18px 2px}
  details{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
  summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--muted)}

  /* ---- M2：工具栏 / 地图 / 拖拽 ---- */
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
  .toolbar .hint{margin-top:0}
  .grip{cursor:grab;color:#c2c9d1;user-select:none;font-size:14px;padding:0 4px;line-height:1;letter-spacing:-1px}
  .grip:active{cursor:grabbing}
  .mini{font-size:11px;padding:2px 8px;line-height:1.4;border-radius:6px;white-space:nowrap}
  .rowact{flex:0 0 auto;display:flex;align-items:center;gap:2px;padding-top:1px}
  li.dragging{opacity:.35}
  li.droptarget{outline:2px dashed var(--blue);outline-offset:-2px;background:var(--bluebg)}
  .amap{height:300px;border:1px solid var(--line);border-radius:10px;background:#f0f2f5;overflow:hidden}
  .days{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .days button{padding:3px 12px;font-size:11.5px}
  .days button.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .maperr{padding:16px;color:var(--muted);font-size:12px}

  /* ---- 醒目失败提示：面板此前失败只在 11px 灰字里说一句 ⇒ 用户看到的是「点了没反应」 ---- */
  .alert{display:none;margin:0 0 12px;padding:9px 12px;border-radius:8px;
         background:var(--badbg);border:1px solid #e6b3b3;color:#5f2020;font-size:12px;
         line-height:1.6;white-space:pre-line}
  .alert.ok{background:var(--okbg);border-color:#a9d9c8;color:#0f4a3a}
</style>
</head>
<body>

<h1><span id="titleCity">TripPlanner 行程面板</span> <span class="tag" id="stage">M3</span></h1>
<div class="sub" id="subLine">正在连接宿主并读取行程…</div>
<div id="alert" class="alert"></div>

<div class="toolbar" id="toolbar" style="display:none">
  <button class="primary" id="btnExport" onclick="exportMd()">⬇ 导出 Markdown</button>
  <span class="badge b-idle" id="chan">通道未探测</span>
  <span class="hint" id="toolHint"></span>
</div>

<div class="card" id="mapCard" style="display:none">
  <h2>路线地图 <span class="hint" id="mapTitle" style="font-weight:400"></span></h2>
  <div class="days" id="mapDays"></div>
  <div class="amap" id="amap"></div>
  <div class="hint" id="mapHint">等待行程…</div>
</div>

<div id="content"><div class="empty">等待行程数据…</div></div>

<details>
  <summary>协议诊断（排查用）</summary>
  <div class="card" style="margin-top:10px">
    <h2>AppBridge 握手</h2>
    <div class="row"><span class="k">桥接状态</span><span class="v"><span class="badge b-idle" id="st">未探测</span></span></div>
    <div class="row"><span class="k">宿主信息</span><span class="v" id="host">—</span></div>
    <div class="row"><span class="k">宿主能力</span><span class="v" id="caps">—</span></div>
    <div class="row"><span class="k">appInstanceId</span><span class="v" id="iid">—</span></div>
    <div class="row"><span class="k">自报登记（A）</span><span class="v"><span class="badge b-idle" id="st3">待握手</span> <span id="reg">—</span></span></div>
    <div class="row"><span class="k">数据诊断</span><span class="v" id="diag2">—</span></div>
    <div class="row"><span class="k">页面路径</span><span class="v" id="diag3">—</span></div>
    <div class="row"><span class="k">照片加载</span><span class="v" id="diagPhoto">—</span></div>
    <div class="row"><span class="k">地图状态</span><span class="v" id="diagMap">—</span></div>
    <div class="row"><span class="k">线上后端</span><span class="v" id="diagApi">—</span></div>
    <div class="btns">
      <button class="primary" id="btnProbe" onclick="probe()">探测桥接</button>
      <button id="btnPing" onclick="callPing()" disabled>调 tripplanner_ping</button>
      <button id="btnReload" onclick="loadPlan()" disabled>重新拉取行程</button>
      <button id="btnMapRetry" onclick="retryMap()" disabled>重试地图</button>
      <button id="btnApi" onclick="retryApi()">测试后端 / 重试</button>
    </div>
    <div class="row" style="margin-top:6px"><span class="k">ping 回显</span><span class="v" id="echo">—</span></div>
  </div>
  <div class="card">
    <h2>CSP 放行验证 · 高德图片直链</h2>
    <div class="row"><span class="k">图片加载</span><span class="v"><span class="badge b-idle" id="st4">未测试</span></span></div>
    <div class="btns"><button id="btnImg" onclick="probeImage()" disabled>加载一张高德直链图</button></div>
    <div id="imgbox" style="margin-top:8px"></div>
  </div>
  <div class="card">
    <h2>原始消息日志</h2>
    <pre id="log">（等待消息…）</pre>
    <div class="hint">握手或取数对不上时，这份日志是唯一的真相来源。</div>
  </div>
</details>

<script>
(function(){
  "use strict";

  var logEl = document.getElementById("log");
  var first = true;
  var nextId = 1, pending = {}, appInstanceId = "";
  var hostCaps = {};          // 宿主能力：downloadFile / openLinks / serverTools …
  var LAST = null;            // 最近一次渲染的 plan（换点 / 重排后整体替换）
  var dayPoiIds = {};         // {day: [poiId,...]} —— 拖拽排序用
  var dragFrom = null;
  var amapKey = "__AMAP_JS_KEY__";   // server 在 resources/read 时注入；未配置则保持占位符
  var amapObj = null, amapLoading = false, mapDay = 1;

  // ---------------- M5：后端**全走线上** ----------------
  // 为什么不再用本地服务（历史结论，留档避免走回头路）：
  //   ① 宿主的 tools/call 通道在本机是**死的**（2026-10-09 取证：有 rpc.callTool /
  //      proxyAppToolCall.ok，但请求从未到达 MCP server，12ms 假成功，textLen 恒 43）。
  //   ② 于是 M2 起了 127.0.0.1 的本地 HTTP(local_api) 兜底、M3 又加了线上兜底。
  //   ③ 但 MCP App 要**打包分享**给他人，而 MCP server 跑在**对方机器**上 —— 若规划
  //      留本地，对方就得装 Python + ortools + 2.6M 数据 + 自备 API Key。全走线上后
  //      对方零依赖，所以 M5 起本地服务整个下线，只留线上后端这一条路。
  // 云端地址 / Basic 凭据由 server 从 remote.json 注入（仓库里只留占位符，凭据不入库）。
  var REMOTE_BASE = "__REMOTE_API_BASE__";           // server 在 resources/read 时注入
  if (!REMOTE_BASE || REMOTE_BASE.indexOf("__REMOTE") === 0) REMOTE_BASE = "";
  REMOTE_BASE = REMOTE_BASE.replace(/\/+$/, "");
  // 云主机 nginx 开了 HTTP Basic 认证 ⇒ 每个请求都要带 Authorization 头。
  var REMOTE_AUTH = "__REMOTE_API_AUTH__";
  if (!REMOTE_AUTH || REMOTE_AUTH.indexOf("__REMOTE") === 0) REMOTE_AUTH = "";
  // 云端**无状态**（入参自包含，天然支持多用户并发）⇒「我这份行程现在是什么」
  // 需要一把钥匙：session id 由 server 生成并落盘，plan / move / replace / 拉行程
  // 全程带着它，云端据此记住「本会话的当前行程」。
  var SESSION_ID = "__SESSION_ID__";
  if (!SESSION_ID || SESSION_ID.indexOf("__SESSION") === 0) SESSION_ID = "";
  // 冷启动兜底：server 渲染时注入的当前行程（云端会话过期 / 首次加载时用）。
  var PLAN_SEED = __PLAN_JSON__;

  var BACKENDS = [];
  if (REMOTE_BASE) BACKENDS.push({ name: "线上", base: REMOTE_BASE, token: "", auth: REMOTE_AUTH });

  var apiBk = null;              // 当前选中的后端（探活后确定）
  var apiMode = "未探测";        // "http" | "down" | "host" | "未探测"
  var apiErr = "";
  var apiInfo = null;

  function log(dir, obj){
    var line;
    try { line = dir + " " + JSON.stringify(obj); }
    catch(e){ line = dir + " [无法序列化] " + String(obj); }
    if (first){ logEl.textContent = ""; first = false; }
    logEl.textContent += line + "\n";
    logEl.scrollTop = logEl.scrollHeight;
  }

  function setBadge(id, text, cls){
    var el = document.getElementById(id);
    if (!el) return;
    el.textContent = text; el.className = "badge " + cls;
  }

  // 诊断行：把「实际拿到的结构」摊开，用于区分「数据没到」与「渲染出错」
  function setDiag(label, text, id){
    var el = document.getElementById(id || "diag2");
    if (el) el.textContent = label + "：" + text;
  }

  function toast(msg){
    var el = document.getElementById("toolHint");
    if (el) el.textContent = msg;
    log("!", msg);
  }

  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");
  }

  function send(obj){
    log("→", obj);
    try { window.parent.postMessage(obj, "*"); }
    catch(e){ log("!", "postMessage 失败: " + e.message); }
  }

  function request(method, params){
    var id = nextId++;
    return new Promise(function(resolve, reject){
      pending[id] = { resolve: resolve, reject: reject };
      send({ jsonrpc: "2.0", id: id, method: method, params: params || {} });
      setTimeout(function(){
        if (pending[id]){ delete pending[id]; reject(new Error("超时（10s）：" + method)); }
      }, 10000);
    });
  }

  // ---------------- M2.1/2.2：后端 HTTP 客户端 ----------------
  function showAlert(msg, ok){
    var el = document.getElementById("alert");
    if (!el) return;
    el.textContent = msg;
    el.className = "alert" + (ok ? " ok" : "");
    el.style.display = "block";
  }
  function clearAlert(){
    var el = document.getElementById("alert");
    if (el) el.style.display = "none";
  }

  function setDiagApi(){
    var el = document.getElementById("diagApi");
    var badge = document.getElementById("chan");
    var text;
    if (apiMode === "http"){
      text = "✅ 已连上**线上后端** " + (apiBk ? apiBk.base : "")
        + (apiInfo && apiInfo.version ? "（v" + apiInfo.version + "）" : "")
        + (SESSION_ID ? "　会话 " + SESSION_ID.slice(0, 6) : "　⚠ 未注入 session");
      if (badge){ badge.textContent = "线上后端"; badge.className = "badge b-blue"; }
    } else if (apiMode === "down"){
      text = "⚠ 线上后端不可达：" + (apiErr || "连接失败")
        + (REMOTE_BASE ? "　→ 换点 / 拖拽 / 导出暂不可用" : "　（未注入后端地址）");
      if (badge){ badge.textContent = "后端不可用"; badge.className = "badge b-bad"; }
    } else if (apiMode === "host"){
      text = "⚠ 线上后端不可用：" + apiErr + "　→ 面板交互暂不可用";
      if (badge){ badge.textContent = "后端不可用"; badge.className = "badge b-bad"; }
    } else {
      text = "未探测";
      if (badge){ badge.textContent = "通道未探测"; badge.className = "badge b-idle"; }
    }
    if (el) el.textContent = text;
  }

  // 面板侧动作轨迹 → 落服务端 output/mcp_debug.log（panel.trace）。
  // 为什么值得做：面板是黑盒，失败时只能靠猜。有了它，「点了没反应」到底是
  // 「按钮没触发」「本地服务死了」还是「服务端拒绝」一眼可分。
  function trace(action, detail){
    var payload = { action: action, detail: String(detail == null ? "" : detail),
                    api: apiMode, via: apiBk ? apiBk.name : "", has_plan: !!LAST,
                    t: new Date().toLocaleTimeString() };
    log("!", "trace " + action + " " + payload.detail);
    try {
      var bk = apiBk || BACKENDS[0];
      var h = { "Content-Type": "application/json" };
      if (bk && bk.token) h["X-Tripplanner-Token"] = bk.token;
      if (bk && bk.auth) h["Authorization"] = bk.auth;
      fetch(bk.base + "/api/log", { method: "POST", headers: h,
                                    body: JSON.stringify(payload) })["catch"](function(){});
    } catch (e) {}
  }

  // 直连某个后端 HTTP：返回结构化结果（形状与工具的 structuredContent 一致）
  function httpJsonOn(bk, path, body, method){
    var m = method || (body ? "POST" : "GET");
    var opt = { method: m, headers: {} };
    if (bk && bk.token) opt.headers["X-Tripplanner-Token"] = bk.token;
    // M4：线上后端（云主机）走 nginx Basic 认证 —— 必须带 Authorization 头。
    // ⚠️ 带了它请求就**不再是简单请求** ⇒ 浏览器先发 OPTIONS 预检；
    //    nginx 侧已把 OPTIONS 豁免出 Basic 认证，服务端 do_OPTIONS 回放 CORS，
    //    否则预检被 401，请求根本发不出去（表现为「线上后端不可达」）。
    if (bk && bk.auth) opt.headers["Authorization"] = bk.auth;
    // 🔴 GET/HEAD **绝不能带 body**：浏览器会**同步**抛
    //    TypeError: Request with GET/HEAD method cannot be used with a body。
    //    踩过（2026-10-09）：启动时的 GET /api/plan 因为这个连请求都没发出去，
    //    整条「探通路 → 拉行程」链静默断掉，日志里连一条 /api/plan 都看不到。
    if (body && m !== "GET" && m !== "HEAD"){
      opt.headers["Content-Type"] = "application/json";
      opt.body = JSON.stringify(body);
    }
    var ctl = (typeof AbortController !== "undefined") ? new AbortController() : null;
    // 线上后端可能撞上 CloudStudio 冷启动 ⇒ 给更宽的超时（探活另有短超时，见 pickBackend）
    var to = (bk && bk.name === "线上") ? 25000 : 8000;
    var timer = setTimeout(function(){ if (ctl) ctl.abort(); }, to);
    return fetch(bk.base + path, opt).then(function(r){
      return r.text().then(function(t){
        var j = null;
        try { j = JSON.parse(t); } catch (e){}
        if (!r.ok) throw new Error("HTTP " + r.status + (j && j.error ? "：" + j.error : ""));
        if (!j) throw new Error("返回不是 JSON：" + String(t).slice(0, 80));
        return j;
      });
    }).then(function(j){ clearTimeout(timer); return j; },
            function(e){ clearTimeout(timer); throw e; });
  }

  // 便捷封装：对「当前后端」发请求 —— trace / 旁路用
  function httpJson(path, body, method){
    return httpJsonOn(apiBk || BACKENDS[0], path, body, method);
  }

  // 宿主通道（保留为兜底 + 对照；实测在本机不通）
  function toolCall(name, args){
    return request("tools/call", { name: name, arguments: args || {} })
      .then(function(res){ return (res && res.structuredContent) || {}; });
  }

  function retriable(msg){
    return /Failed to fetch|NetworkError|aborted|超时|HTTP 5\d\d/.test(String(msg || ""));
  }

  var reviveTried = false;
  // M5：本地常驻服务已**下线**，「请宿主唤醒本地服务」这套自愈随之作废 ——
  // 后端在云端，不存在「被宿主回收」这回事。保留空实现仅为兼容既有调用点。
  function reviveViaHostBestEffort(){
    reviveTried = true;
  }

  // 廉价探活：仅当「上次不是健康态」或「距上次探活 >20s」才真的打请求。
  // 目的：每次交互前先确认服务在不在 —— 不在就**先等它回来**，
  // 而不是让用户等 8s 超时 + 1.2s 重试后才看到一句「点了没反应」。
  var lastProbeAt = 0;
  var WAIT_API_MS = 60000;        // 掉线后最多等 60s（server 侧任何一次请求都会把它拉起来）

  function markHealthy(j){
    apiMode = "http"; apiInfo = j; apiErr = ""; lastProbeAt = Date.now();
    setDiagApi();
  }

  // 选后端：20s 内探活过 → 直接用；否则探活。
  // M5 起只剩**一个**后端（线上），但这里仍按「列表」写 —— 日后加备用后端不必改结构。
  function pickBackend(localOnly, tried){
    tried = tried || {};
    var now = Date.now();
    if (apiBk && !tried[apiBk.name] && (now - lastProbeAt) < 20000){
      return Promise.resolve(apiBk);
    }
    var list = BACKENDS.filter(function(b){ return !tried[b.name]; });
    var i = 0;
    return new Promise(function(resolve){
      (function next(){
        if (i >= list.length){ resolve(null); return; }
        var bk = list[i++];
        httpJsonOn(bk, "/api/health", null, "GET").then(function(j){
          apiBk = bk; apiInfo = j; apiErr = "";
          lastProbeAt = Date.now(); apiMode = "http";
          setDiagApi();
          log("!", "后端可用：" + bk.name + " " + bk.base);
          resolve(bk);
        })["catch"](function(e){
          log("!", "后端不可达 " + bk.name + "（" + bk.base + "）：" + e.message);
          next();
        });
      })();
    });
  }

  function ensureApi(){
    return pickBackend(false, {}).then(function(bk){ return !!bk; });
  }

  // 掉线后**等它回来**：每 2s 复探一次，横幅显示已等多久。
  // （M3 起 apiCall 不再「先死等再发」——有线上兜底时直接换后端更快；
  //   此函数保留给「所有后端都不可用」时的显式重试 / 自动重试使用。）
  function waitForApi(maxMs, note){
    var t0 = Date.now();
    return new Promise(function(resolve){
      (function loop(){
        pickBackend(false, {}).then(function(bk){
          if (bk){
            clearAlert();
            toast("✅ 后端已恢复（" + bk.name + "），正在继续…");
            trace("api.recovered", bk.name);
            resolve(true);
            return;
          }
          if (Date.now() - t0 >= maxMs){ resolve(false); return; }
          apiMode = "down"; setDiagApi();
          showAlert("⏳ 后端仍不可用，正在等待恢复…（已等 "
            + Math.round((Date.now() - t0) / 1000) + "s / 最多 "
            + Math.round(maxMs / 1000) + "s）\n" + (note || ""));
          setTimeout(loop, 2000);
        });
      })();
    });
  }

  // 统一入口：对所有后端依次尝试（M5 只剩「线上」一个）。
  // ⚠️ 失败**不再**静默回落到已知不通的宿主通道（那只会换来 10s 静默等待）。
  //    顺序：探活选出可用后端 → 发请求；连接级失败 ⇒ 排除该后端、换下一个再试。
  //    `opts.localOnly` 自 M5 起**已无语义**（没有本地后端了），保留参数仅为兼容调用点：
  //    它现在只影响「失败时要不要刷红色横幅」（拉行程失败属预期内，温和处理）。
  function apiCall(path, toolName, args, method, opts){
    opts = opts || {};
    var tried = {};
    function hasUntried(){
      for (var i = 0; i < BACKENDS.length; i++){
        if (!tried[BACKENDS[i].name]) return true;
      }
      return false;
    }
    function attempt(){
      return pickBackend(false, tried).then(function(bk){
        if (!bk){
          throw new Error("线上后端不可用");
        }
        tried[bk.name] = true;
        apiBk = bk; apiMode = "http"; setDiagApi();
        return httpJsonOn(bk, path, args, method)["catch"](function(e){
          if (hasUntried() && retriable(e.message)){
            log("!", "调用失败，切下一后端（" + bk.name + " · " + e.message + "）");
            return attempt();
          }
          throw e;
        });
      });
    }
    return attempt()["catch"](function(e){
      log("!", "apiCall 失败 " + path + "：" + e.message);
      if (opts.localOnly){
        // 「拉行程」失败是**预期内**的（会话过期 / 后端冷启动）——不刷红色横幅。
        return Promise.reject(e);
      }
      apiMode = "down"; apiErr = e.message; setDiagApi();
      showAlert("⚠ 操作失败：" + e.message + "\n"
        + "· 后端：" + (REMOTE_BASE || "未注入（remote.json 缺少 base）")
        + "（若正在冷启动，稍等几秒再点一次）。");
      throw e;
    });
  }

  // 服务健康看门狗：每 15s 轻探一次。掉线立即**响亮提示**（不再只写 11px 灰字），
  // 恢复则**自动重新拉取行程** —— 面板不需要用户干预就能回到可用状态。
  var lastHealthy = null;
  function watchdogTick(){
    var bk = apiBk || BACKENDS[0];
    httpJsonOn(bk, "/api/health", null, "GET").then(function(j){
      var wasDown = (lastHealthy === false) || (apiMode === "down");
      apiBk = bk; markHealthy(j);
      lastHealthy = true;
      if (wasDown){
        clearAlert();
        toast("✅ 后端已恢复（" + bk.name + "）");
        trace("api.up", bk.name);
        loadPlan();                       // 重新对齐磁盘上的行程（真相同在磁盘）
      }
    })["catch"](function(e){
      if (lastHealthy !== false && !apiWaiting){
        apiBk = null;                     // 下次操作重新选后端（有线上兜底 ⇒ 不会卡死）
        apiMode = "down"; apiErr = e.message; setDiagApi();
        showAlert("⚠ " + bk.name + "后端不可达（" + e.message + "）—— 下次操作会自动重试。\n"
          + "· 云端冷启动通常几秒，稍等即可；若持续失败，检查 remote.json 的 base 与凭据。");
        trace("api.down", bk.name + ":" + e.message);
      }
      lastHealthy = false;
    });
  }
  function startWatchdog(){
    if (watchdogTimer) return;
    watchdogTimer = setInterval(watchdogTick, 15000);
  }
  var watchdogTimer = null;
  var apiWaiting = false;

  window.probeApi = function(){
    apiBk = null; lastProbeAt = 0;
    return pickBackend(false, {}).then(function(bk){
      if (bk){
        log("!", "后端可用 " + bk.name + " " + JSON.stringify(apiInfo || {}));
        return true;
      }
      apiMode = "down"; apiErr = "无可用后端"; setDiagApi();
      log("!", "无可用后端（线上后端不可达）");
      return false;
    });
  };

  // 诊断区「测试 / 重试」：重探后端，通了就自动重拉行程。
  window.retryApi = function(){
    trace("api.retry", "");
    apiWaiting = false;
    return probeApi().then(function(okNow){
      if (okNow){
        clearAlert(); lastHealthy = true;
        toast("✅ 后端正常（" + (apiBk ? apiBk.name : "") + "）");
        loadPlan();
        return true;
      }
      apiWaiting = true;
      showAlert("⚠ 线上后端不可用。\n"
        + "· 后端：" + (REMOTE_BASE || "未配置（remote.json 缺少 base）") + "\n"
        + "· 可能正在冷启动，稍等几秒再试。");
      return waitForApi(20000, "（自动重试中…）").then(function(ok){
        apiWaiting = false;
        if (ok) loadPlan();
        return ok;
      });
    });
  };

  function extractInstanceId(src){
    if (!src || typeof src !== "object") return "";
    var cands = [
      src.appInstanceId, src.instanceId,
      src.appInfo && src.appInfo.appInstanceId,
      src.hostContext && src.hostContext.appInstanceId,
      src.hostContext && src.hostContext.instanceId,
      src.hostInfo && src.hostInfo.appInstanceId,
      src.hostInfo && src.hostInfo.instanceId,
    ];
    for (var i = 0; i < cands.length; i++){
      if (typeof cands[i] === "string" && cands[i].trim()) return cands[i].trim();
    }
    return "";
  }

  // ---------------- 行程渲染 ----------------
  var photoStat = { ok: 0, fail: 0 };
  var renderedOnce = false;     // 是否成功渲染过行程 —— 防「空结果覆盖好内容」

  // 由 start/end 反推停留时长 —— 内核的 timeline 只给时刻，不给 duration，
  // 但「每个点待多久」是用户最关心的信息之一。
  function durText(a, b){
    function toMin(t){
      var m = String(t == null ? "" : t).match(/^(\d{1,2}):(\d{2})$/);
      return m ? (+m[1]) * 60 + (+m[2]) : null;
    }
    var x = toMin(a), y = toMin(b);
    if (x == null || y == null) return "";
    var d = y - x;
    if (d <= 0) d += 24 * 60;          // 跨零点兜底
    if (d <= 0) return "";
    var hh = Math.floor(d / 60), mm = d % 60;
    return (hh ? hh + "小时" : "") + (mm ? mm + "分" : "");
  }

  window.photoOk = function(){
    photoStat.ok++;
    document.getElementById("diagPhoto").textContent =
      "成功 " + photoStat.ok + " / 失败 " + photoStat.fail;
  };
  window.photoFail = function(el){
    photoStat.fail++;
    el.style.display = "none";        // 破图不留占位框，但计数留痕
    document.getElementById("diagPhoto").textContent =
      "成功 " + photoStat.ok + " / 失败 " + photoStat.fail
      + "（失败多为 CSP 拦截或 URL 失效）";
  };

  function render(plan){
    var box = document.getElementById("content");
    if (!plan){
      box.innerHTML = '<div class="empty">还没有行程。请对助手说一句需求，'
        + '例如「杭州2天，带8岁孩子，想看西湖和灵隐寺」。</div>';
      setDiag("render 入参", "plan 为空（server 侧 hasPlan=false）");
      return;
    }

    LAST = plan;
    dayPoiIds = {};

    // 拿到数据先算结构摘要 —— 出问题时「数据没到」与「渲染出错」一眼可分
    var keys = Object.keys(plan);
    var dl = plan.dayList || [];
    var tlTot = 0, poiTot = 0;
    dl.forEach(function(d){
      var tl = d.timeline || [];
      tlTot += tl.length;
      tl.forEach(function(s){ if (s.type === "poi") poiTot++; });
    });
    renderedOnce = true;
    setDiag("render 入参",
      "字段 " + keys.length + " 个｜dayList=" + dl.length
      + " 天｜timeline=" + tlTot + " 条｜poi=" + poiTot);
    log("!", "render: keys=" + keys.join(",") + " dayList=" + dl.length
      + " timeline=" + tlTot);

    document.getElementById("titleCity").textContent = "【" + plan.city + "】" + plan.days + " 天行程";
    // mode 徽标 —— 必须与 Web UI(index.html) / 导出(md_export.mode_label) **同一口径**。
    // ⚠️ 2026-10-10 实测暴露：原来只判 `/^llm/`，而线上**主路径**是 `m7_proposal`
    //    （不以 llm 开头）⇒ 每一次 M7 行程面板都错显「离线兜底规划」。
    var _m = String(plan.mode || ""), _low = _m.toLowerCase();
    var _deg = /degrad|fallback|offline/.test(_low);
    var _name = _m.indexOf("m7") === 0 ? "M7 经验提案"
              : _m.indexOf("m2") === 0 ? "M2 库内直选 + TOPTW"
              : /^llm/.test(_low) ? "LLM 规划"
              : "离线兜底规划";
    var _okMode = !_deg && _name !== "离线兜底规划";
    var modeBadge = '<span class="badge ' + (_okMode ? 'b-ok' : 'b-blue') + '">'
                  + _name + (_deg && _name !== "离线兜底规划" ? "（降级）" : "") + '</span>';
    var violBadge = (plan.totalViolations === 0)
      ? '<span class="badge b-ok">硬约束 0 违规</span>'
      : '<span class="badge b-bad">违规 ' + plan.totalViolations + '</span>';
    document.getElementById("subLine").innerHTML =
      modeBadge + violBadge + '<span class="badge b-idle">' + esc(plan.generatedAt) + '</span>'
      + (plan.updatedAt ? '<span class="badge b-blue">已调整 ' + esc(plan.updatedAt) + '</span>' : '');

    document.getElementById("toolbar").style.display = "flex";

    var h = "";
    h += '<div class="card"><h2>总览</h2>';
    h += '<div class="row"><span class="k">需求</span><span class="v">' + esc(plan.query) + '</span></div>';
    h += '<div class="metrics">';
    h += '<span>总里程 <b>' + plan.totalTravelKm + ' km</b></span>';
    h += '<span>候选池 <b>' + (plan.candidates == null ? "—" : plan.candidates) + '</b> 个点</span>';
    // ⚠️ 一律用 (x || []) 兜底：少一个字段就抛异常 ⇒ innerHTML 永不赋值 ⇒
    //    整个行程区空白，且用户看不出为什么（这类故障最难查）。
    h += '<span>剔除 <b>' + (plan.droppedPois || []).length + '</b></span>';
    h += '<span>模式 <b>' + esc(plan.mode) + '</b></span>';
    if (plan.date0) h += '<span>起始 <b>' + esc(plan.date0) + '</b></span>';
    h += '</div>';
    if (plan.hotel){
      h += '<div class="row" style="margin-top:6px"><span class="k">住宿锚点</span><span class="v">'
        + esc(plan.hotel.name) + '（' + esc(plan.hotel.resolved) + '）</span></div>';
    }
    h += '<div class="hint">提示：拖动行首 ⠿ 可调整当天景点顺序；点行尾 🔁 可换成同类目就近的点。</div>';
    h += '</div>';

    // 数据不完整时给出明确诊断，别让用户对着空面板猜
    if (!dl.length){
      h += '<div class="card"><h2>⚠ 行程数据不完整</h2>';
      h += '<div class="row"><span class="k">已收到字段</span><span class="v">'
        + esc(keys.join("、")) + '</span></div>';
      h += '<div class="row"><span class="k">缺失</span><span class="v">'
        + 'dayList（每天的时间线）</span></div>';
      h += '<div class="hint">server 返回了顶层字段却没有 dayList —— '
        + '请把这段连同「协议诊断 → 原始消息日志」一起反馈。</div></div>';
      box.innerHTML = h;
      return;
    }

    dl.forEach(function(d){
      var poiSeq = 0;
      dayPoiIds[d.day] = [];

      h += '<div class="day"><div class="day-h">';
      h += '<div class="t">Day ' + d.day + ' · ' + esc(d.theme || "未命名主题") + '</div>';
      h += '<div class="meta">日交通 ' + d.travel_km + 'km / ' + d.travel_h + 'h'
        + '　收工 ' + esc(d.finish || "-")
        + (d.weekday ? '　' + esc(d.weekday) : '')
        + (d.reordered ? '　<span class="badge b-blue">顺序经约束修复</span>' : '')
        + '</div></div><div class="day-b"><ul class="tl">';

      (d.timeline || []).forEach(function(s){
        var cls = s.type === "hop" ? "hop" : (s.type === "meal" ? "meal" : "poi");
        var icon = s.type === "hop" ? "→" : (s.type === "meal" ? "🍽" : "📍");
        var isPoi = (cls === "poi");
        var pIdx = -1;
        if (isPoi){
          pIdx = poiSeq++;
          if (s.id) dayPoiIds[d.day].push(s.id);
        }
        h += '<li class="' + cls + '"'
          + (isPoi ? ' draggable="true" data-day="' + d.day + '" data-idx="' + pIdx
                     + '" data-id="' + esc(s.id) + '"' : '')
          + '>';
        h += '<span class="time">' + esc(s.start) + (s.end ? "–" + esc(s.end) : "")
          + (function(){ var t = (cls === "poi" || cls === "meal") ? durText(s.start, s.end) : "";
                         return t ? '<i class="dur">' + t + '</i>' : ""; })()
          + '</span>';
        if (isPoi){
          h += '<span class="grip" title="拖动调整顺序">⠿</span>';
        }
        if (isPoi && s.photo){
          h += '<img class="thumb" src="' + esc(s.photo) + '" alt="" '
            + 'title="' + esc(s.name) + '" '
            + 'onload="photoOk()" onerror="photoFail(this)">';
        }
        h += '<span class="body"><span class="nm">' + icon + " " + esc(s.name) + '</span>';
        if (cls === "hop" && (s.km || s.min)){
          h += '<span class="hopx" style="color:#666e78;font-size:11.5px">　'
            + (s.km != null ? s.km + "km" : "") + (s.min != null ? " · " + s.min + "分钟" : "")
            + '</span>';
        }
        h += '</span>';
        if (isPoi){
          h += '<span class="rowact">'
            + '<button class="mini" title="换成同类目、就近的另一个点" '
            + 'onclick="replacePoi(' + d.day + ',\'' + esc(s.id) + '\')\">🔁</button>'
            + '</span>';
        }
        h += '</li>';
      });
      h += '</ul>';

      if (d.reason) h += '<div class="sub-reason">' + esc(d.reason) + '</div>';
      if (d.violations && d.violations.length){
        h += '<div class="viol">⚠ 违规：' + esc(d.violations.join("；")) + '</div>';
      }
      if (d.dropped && d.dropped.length){
        h += '<div class="drop">✕ 剔除：'
          + d.dropped.map(function(p){ return esc(p.name) + "（" + esc(p.reason) + "）"; }).join("；")
          + '</div>';
      }
      h += '</div></div>';
    });

    if (plan.substitutes && plan.substitutes.length){
      h += '<div class="card"><h2>替代推荐</h2>';
      plan.substitutes.forEach(function(s){
        h += '<div class="row"><span class="k">' + esc(s["for"]) + '</span><span class="v">'
          + esc(s.reason) + '</span></div>';
      });
      h += '</div>';
    }

    box.innerHTML = h;
    setupMap(plan);
  }

  // ---------------- M2：地图（高德 JS API） ----------------
  // CSP 依据（app.asar buildCspMeta 取证）：
  //   script-src 拼的是 resourceDomains ⇒ 已放行 https://*.amap.com，JS 载体能加载；
  //   瓦片走 img-src（同样是 resourceDomains）⇒ *.autonavi.com 已放行；
  //   JS API 内部 XHR 走 connect-src ⇒ connectDomains 已加高德域名。
  function setMapHint(t){
    var el = document.getElementById("mapHint");
    if (el) el.textContent = t;
    setDiag("地图状态", t, "diagMap");
  }

  function loadAmap(cb){
    if (!amapKey || amapKey.indexOf("__AMAP") === 0){
      setMapHint("未在 secrets.json 配置 amap_js_key —— 地图不可用（行程与交互功能不受影响）");
      return;
    }
    if (window.AMap){ cb(); return; }
    if (amapLoading) return;
    amapLoading = true;
    setMapHint("正在加载高德 JS API…");
    var s = document.createElement("script");
    s.src = "https://webapi.amap.com/maps?v=2.0&key=" + encodeURIComponent(amapKey);
    s.onload = function(){
      amapLoading = false;
      log("!", "高德 JS API 加载成功");
      try { cb(); } catch(e){ setMapHint("地图绘制失败：" + e.message); }
    };
    s.onerror = function(){
      amapLoading = false;
      setMapHint("高德 JS API 加载失败（CSP 拦截或网络不通）—— 行程与交互功能不受影响");
      log("!", "高德 JS API 加载失败");
    };
    document.head.appendChild(s);
  }

  function setupMap(plan){
    var card = document.getElementById("mapCard");
    var dl = (plan && plan.dayList) || [];
    var hasCoord = false;
    dl.forEach(function(d){
      (d.timeline || []).forEach(function(s){
        if (s.type === "poi" && s.lat != null && s.lng != null) hasCoord = true;
      });
    });
    if (!dl.length){ card.style.display = "none"; return; }
    card.style.display = "block";

    // Day 切换按钮
    var bar = document.getElementById("mapDays");
    bar.innerHTML = "";
    dl.forEach(function(d){
      var b = document.createElement("button");
      b.textContent = "Day " + d.day;
      if (+d.day === +mapDay) b.className = "on";
      b.onclick = function(){ mapDay = +d.day; setupMap(plan); };
      bar.appendChild(b);
    });

    if (!hasCoord){
      setMapHint("行程数据里没有坐标（lat/lng），地图无法绘制 —— 请反馈：server 未下发坐标");
      return;
    }
    document.getElementById("btnMapRetry").disabled = false;
    drawMap();
  }

  function drawMap(){
    var plan = LAST;
    if (!plan) return;
    var d = null;
    (plan.dayList || []).forEach(function(x){ if (+x.day === +mapDay) d = x; });
    if (!d) return;
    var pts = [];
    (d.timeline || []).forEach(function(s){
      if (s.type === "poi" && s.lat != null && s.lng != null){
        pts.push({ name: s.name, lat: +s.lat, lng: +s.lng });
      }
    });
    if (!pts.length){ setMapHint("Day " + mapDay + " 没有可定位的景点"); return; }

    if (!window.AMap){ loadAmap(function(){ drawMap(); }); return; }

    try {
      if (amapObj && amapObj.destroy) { try { amapObj.destroy(); } catch(e){} }
      amapObj = new AMap.Map("amap", {
        zoom: 12, center: [pts[0].lng, pts[0].lat], viewMode: "2D",
        mapStyle: "amap://styles/normal"
      });
      var path = pts.map(function(p){ return [p.lng, p.lat]; });
      if (path.length > 1){
        new AMap.Polyline({
          path: path, map: amapObj, strokeColor: "#185fa5", strokeWeight: 4,
          strokeOpacity: 0.85, lineJoin: "round", showDir: true
        });
      }
      pts.forEach(function(p, i){
        new AMap.Marker({
          position: [p.lng, p.lat], map: amapObj,
          label: {
            direction: "top",
            content: '<span style="background:#185fa5;color:#fff;border-radius:9px;'
                   + 'padding:1px 6px;font-size:11px;line-height:16px;display:inline-block">'
                   + (i + 1) + '</span>'
          }
        });
      });
      amapObj.setFitView(null, false, [40, 40, 40, 40]);
      setMapHint("Day " + mapDay + "：已定位 " + pts.length + " 个景点（序号对应下方时间线顺序）");
    } catch(e){
      setMapHint("地图渲染失败：" + e.message + " —— 行程与交互功能不受影响");
      log("!", "地图渲染异常 " + e.message);
    }
  }

  // ---------------- M2：换点 ----------------
  // ---------------- M3：统一收敛后端返回（plan 或 day） ----------------
  // 两个后端返回的形态不同，但语义相同：
  //   · `plan` —— 完整行程（`/api/plan?shape=mcp` 返回，**已归一化**）
  //   · `day`  —— 只有被改的那一天（线上后端无状态；可能归一化形状，也可能是内核形状）
  // ⇒ 统一收敛成「一份新 plan」再渲染；只有 day 时在前端**复现 apply_day**。
  function applyDayToPlan(dayObj){
    if (!LAST || !dayObj) return null;
    // 补 photo / 坐标：内核形状的 day 没有这些字段（线上 /api/replace 返回的就是内核 day）。
    // 从当前已渲染的行程里按 id 找（同一 POI 落在哪一天都行）。
    var byId = {};
    (LAST.dayList || []).forEach(function(d){
      (d.timeline || []).forEach(function(s){
        if (s.type === "poi" && s.id && !byId[s.id]) byId[s.id] = s;
      });
    });
    (dayObj.timeline || []).forEach(function(s){
      if (s.type !== "poi" || !s.id) return;
      var o = byId[s.id];
      if (!o) return;
      if (!s.photo && o.photo) s.photo = o.photo;
      if (s.lat == null && o.lat != null){ s.lat = o.lat; s.lng = o.lng; }
    });
    var d0 = +dayObj.day;
    var days = (LAST.dayList || []).map(function(x){ return (+x.day === d0) ? dayObj : x; });
    var plan = {};
    for (var k in LAST){
      if (Object.prototype.hasOwnProperty.call(LAST, k)) plan[k] = LAST[k];
    }
    plan.dayList = days;
    var km = 0;
    days.forEach(function(x){ km += (+(x.travel_km || 0)); });
    plan.totalTravelKm = Math.round(km * 10) / 10;
    plan.updatedAt = new Date().toLocaleString();
    return plan;
  }

  function applyActionResult(sc){
    if (!sc) return;
    if (sc.plan){ render(sc.plan); return; }        // 本地：完整行程
    if (sc.day){                                    // 线上：只有一天 → 前端写回
      var p = applyDayToPlan(sc.day);
      if (p) render(p);
      return;
    }
    log("!", "结果里既没有 plan 也没有 day —— 画面未更新");
  }

  (function bindDrag(){
    var box = document.getElementById("content");
    box.addEventListener("dragstart", function(e){
      var li = e.target && e.target.closest ? e.target.closest('li[draggable="true"]') : null;
      if (!li) return;
      dragFrom = { day: +li.getAttribute("data-day"), idx: +li.getAttribute("data-idx") };
      li.classList.add("dragging");
      try { e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", "x"); }
      catch(err){}
      log("!", "drag start day=" + dragFrom.day + " idx=" + dragFrom.idx);
      trace("drag.start", "day=" + dragFrom.day + " idx=" + dragFrom.idx);
    });
    box.addEventListener("dragover", function(e){
      if (!dragFrom) return;
      var li = e.target && e.target.closest ? e.target.closest('li[draggable="true"]') : null;
      e.preventDefault();
      var old = box.querySelector("li.droptarget");
      if (old) old.classList.remove("droptarget");
      if (li && +li.getAttribute("data-day") === dragFrom.day) li.classList.add("droptarget");
    });
    box.addEventListener("drop", function(e){
      if (!dragFrom) return;
      e.preventDefault();
      var li = e.target && e.target.closest ? e.target.closest('li[draggable="true"]') : null;
      if (!li){ clearDrag(); return; }
      var day = +li.getAttribute("data-day");
      var to = +li.getAttribute("data-idx");
      var from = dragFrom.idx;
      var sameDay = (day === dragFrom.day);
      clearDrag();
      if (!sameDay || to === from){
        trace("drag.skip", "sameDay=" + sameDay + " from=" + from + " to=" + to);
        return;
      }
      var ids = (dayPoiIds[day] || []).slice();
      if (from < 0 || from >= ids.length) return;
      var moved = ids.splice(from, 1)[0];
      ids.splice(to, 0, moved);
      log("!", "drop day=" + day + " " + from + " -> " + to + " ids=" + ids.join(","));
      callMove(day, ids);
    });
    box.addEventListener("dragend", clearDrag);
  })();

  function deliver(filename, text){
    var hint = document.getElementById("toolHint");
    // 正路：宿主 ui/download-file。
    // 为什么不用 <a download>：面板 iframe 的 sandbox 是
    // "allow-scripts allow-same-origin allow-forms"，**没有 allow-downloads**
    // （2026-10-09 从 app.asar loadResource() 取证）⇒ 浏览器会拦掉下载。
    if (hostCaps && hostCaps.downloadFile){
      request("ui/download-file", {
        contents: [{ uri: "file:///" + filename, mimeType: "text/markdown", text: text }]
      }).then(function(){
        hint.textContent = "✅ 已通过宿主下载：" + filename;
      }).catch(function(e){
        log("!", "ui/download-file 失败：" + e.message);
        copyFallback(text, hint, filename);
      });
      return;
    }
    copyFallback(text, hint, filename);
  }

  function copyFallback(text, hint, filename){
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){
        hint.textContent = "✅ 宿主不支持直接下载，Markdown 已复制到剪贴板（" + text.length + " 字）";
      }).catch(function(){
        showText(text, hint, filename);
      });
    } else {
      showText(text, hint, filename);
    }
  }

  function showText(text, hint, filename){
    hint.textContent = "无法自动下载/复制（" + filename + "），请手动复制下方内容：";
    var box = document.getElementById("exportBox");
    if (!box){

      box.id = "exportBox";
      box.style.cssText = "width:100%;height:170px;margin-top:8px;font-family:ui-monospace,"
        + "Consolas,monospace;font-size:11px;border:1px solid #e3e6ea;border-radius:8px;padding:8px";
      document.getElementById("toolbar").parentNode.insertBefore(
        box, document.getElementById("content"));
    }
    box.value = text;
    box.focus();
    box.select();
  }

  // ---------------- 数据获取 ----------------
  // 通道 1（主）：云端 `GET /api/plan?shape=mcp&session=<sid>` —— 回**本会话当前行程**。
  //   云端刻意无状态，靠 session 记住「你这份行程」；plan / move / replace 都会更新它。
  // 通道 2（兜底）：渲染时注入的 `PLAN_SEED`（server 从磁盘读到的当前行程）——
  //   云端会话过期 / 后端不可达时，至少还有一份可渲染，不至于空白。
  // 通道 3（补）：宿主把 bootstrap 的 tool-result 推下来时直接用它（M1 以来一直靠它）。
  window.loadPlan = function(){
    document.getElementById("subLine").textContent = "正在读取行程…";
    var path = "/api/plan?shape=mcp";
    if (SESSION_ID) path += "&session=" + encodeURIComponent(SESSION_ID);
    // 标 localOnly 只为「失败不刷红色横幅」（会话过期属预期内，落 PLAN_SEED 兜底即可）
    return apiCall(path, "tripplanner_get_plan", {}, "GET", { localOnly: true })
      .then(function(sc){
        sc = sc || {};
        var plan = sc.plan || null;
        if (plan && plan.dayList){
          render(plan);
          document.getElementById("stage").textContent = "M5 · 已加载";
          log("!", "行程加载成功 city=" + plan.city + " via=" + apiMode);
          trace("plan.loaded", "city=" + plan.city + " via=" + apiMode);
          return;
        }
        // 云端没给（会话过期 / 首次加载）⇒ 退到渲染时注入的那份
        if (PLAN_SEED && PLAN_SEED.dayList){
          render(PLAN_SEED);
          document.getElementById("stage").textContent = "M5 · 已加载（本地副本）";
          log("!", "云端无会话 → 用注入的 PLAN_SEED city=" + PLAN_SEED.city);
          trace("plan.loaded", "city=" + PLAN_SEED.city + " via=seed");
          return;
        }
        // ⚠️ 不要用空结果覆盖已渲染好的内容（否则用户看到一片空白，
        //    而之前那次渲染其实是好的）。
        if (renderedOnce){
          setDiag("plan", "云端暂无行程，已保留上一次渲染结果；可点「重新拉取行程」再试");
          log("!", "云端无行程，保留已有渲染（不清空）");
        } else {
          render(null);
          setDiag("plan", "云端暂无行程且尚无任何渲染");
          log("!", "云端暂无行程");
        }
      })
      .catch(function(e){
        document.getElementById("subLine").textContent = "读取失败：" + e.message;
        if (!renderedOnce && PLAN_SEED && PLAN_SEED.dayList){
          render(PLAN_SEED);
          log("!", "拉取失败 → 用注入的 PLAN_SEED 渲染");
        }
        log("!", "拉行程失败：" + e.message);
      });
  };

  // ---------------- 收消息 ----------------
  window.addEventListener("message", function(ev){
    var d = ev.data;
    if (!d || typeof d !== "object") return;
    log("←", d);

    if (d.id != null && pending[d.id]){
      var p = pending[d.id];
      delete pending[d.id];
      if (d.error){ p.reject(new Error((d.error && d.error.message) || "宿主返回错误")); }
      else { p.resolve(d.result); }
      return;
    }

    // 通道 2：宿主把 bootstrap 的工具结果推下来（含 structuredContent.plan）
    if (d.method === "ui/notifications/tool-result"){
      var sc = (d.params && d.params.structuredContent)
            || (d.params && d.params.result && d.params.result.structuredContent) || {};
      if (sc.plan){ render(sc.plan); log("!", "收到宿主 bootstrap 行程"); }
    }
  });

  //    用户看到的是「点了没反应」、日志里一片空白 —— 观测缺陷本身就是缺陷。
  window.addEventListener("error", function(ev){
    var m = ev.message || (ev.error && ev.error.message) || "未知错误";
    showAlert("⚠ 面板脚本出错：" + m + "（详情见下方「协议诊断 → 原始消息日志」）");

  // M4 诊断：把**宿主 iframe 的上下文**一并落盘 —— 这是判断「远端兜底能不能用」的
  // 决定性证据：若 protocol=https，浏览器会把 http://<公网IP> 当 active mixed content

  trace("panel.boot", "v=m12 base=" + (REMOTE_BASE || "none")
        + " auth=" + (REMOTE_AUTH ? "yes" : "no")
        + " session=" + (SESSION_ID ? SESSION_ID.slice(0, 6) : "none")
        + " seed=" + ((PLAN_SEED && PLAN_SEED.dayList) ? "yes" : "no")
        + " proto=" + location.protocol + " origin=" + location.origin);
  probeApi().then(function(okNow){
    trace("panel.apiProbe", okNow ? "ok" : "down");
    lastHealthy = okNow;
    loadPlan();
  });
  // M4 诊断：启动即**主动探一次远端后端**（不等掉线），把成功/失败明细落盘。
  // 这样「远端到底通不通」不再靠猜 —— panel.remoteProbe 里直接有结论。
  setTimeout(function(){
    if (!REMOTE_BASE){ trace("panel.remoteProbe", "skipped(no REMOTE_BASE)"); return; }
    var rb = { name: "线上", base: REMOTE_BASE, token: "", auth: REMOTE_AUTH };
    httpJsonOn(rb, "/api/health", null, "GET").then(function(j){
      trace("panel.remoteProbe", "OK " + REMOTE_BASE + " -> " + JSON.stringify(j).slice(0, 160));
    })["catch"](function(e){
      trace("panel.remoteProbe", "FAIL " + REMOTE_BASE + " :: "
            + (e && e.message ? e.message : String(e)));
    });
  }, 1500);
  startWatchdog();      // 掉线自动提示、恢复自动重拉行程（用户无需干预）
  probe();
})();
</script>
</body>
</html>
