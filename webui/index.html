<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TripAgent · AI 行程规划</title>
<style>
:root{--blue:#1a5fb4;--blue-l:#eef4fc;--green:#1d7a4c;--green-l:#eaf6f0;--red:#c0392b;--red-l:#fdf0ee;
--amber:#b7791f;--amber-l:#fdf6e7;--ink:#1f2933;--mut:#52606d;--line:#e4e7eb;--bg:#f7f8fa}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);line-height:1.65}
.wrap{max-width:1080px;margin:0 auto;padding:24px 20px 60px}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:22px;color:var(--blue)} .sub{color:var(--mut);font-size:13px}
.badge{display:inline-block;padding:1px 9px;border-radius:10px;font-size:12px;font-weight:600}
.b-blue{background:var(--blue-l);color:var(--blue)} .b-green{background:var(--green-l);color:var(--green)}
.b-red{background:var(--red-l);color:var(--red)} .b-amber{background:var(--amber-l);color:var(--amber)}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
label{font-size:12.5px;color:var(--mut);display:block;margin-bottom:3px;font-weight:600}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;background:#fff}
textarea{resize:vertical;min-height:64px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
button{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:10px 26px;font-size:15px;font-weight:600;cursor:pointer}
button:disabled{background:#9db8d9;cursor:not-allowed}
.secbtn{background:#fff;color:var(--blue);border:1px solid var(--blue);padding:9px 18px;font-size:14px;font-weight:500}
.secbtn:hover{background:var(--blue-l)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{background:var(--blue-l);color:var(--blue);border-radius:14px;padding:3px 12px;font-size:12.5px;cursor:pointer}
.radio{display:flex;gap:14px;align-items:center;font-size:13.5px}
.radio label{display:flex;gap:4px;align-items:center;margin:0;font-weight:500;color:var(--ink);cursor:pointer}
#status{color:var(--mut);font-size:13px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--blue);border-top-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.summary{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.daycard{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px;background:#fff}
.dayhead{padding:10px 16px;color:#fff;font-weight:600;font-size:14.5px;display:flex;gap:10px;align-items:center}
.tl{padding:6px 16px 12px}
.tlrow{display:flex;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13.5px;align-items:baseline}
.tlrow:last-child{border-bottom:0}
.time{color:var(--mut);font-size:12.5px;min-width:88px;font-variant-numeric:tabular-nums}
.viol{background:var(--red-l);color:var(--red);border-radius:8px;padding:8px 12px;font-size:12.5px;margin:0 16px 12px}
.drop{background:var(--amber-l);color:var(--amber);border-radius:8px;padding:8px 12px;font-size:12.5px;margin:0 16px 12px}
.map svg{width:100%;background:#f2f4f7;border:1px solid var(--line);border-radius:8px}
.two{display:grid;grid-template-columns:0.85fr 1.15fr;gap:16px}
@media(max-width:820px){.grid,.two{grid-template-columns:1fr}}
/* P0-2 移动端适配：手机单列 + 触控优化 */
@media(max-width:640px){
  .wrap{padding:12px 12px 40px}
  h1{font-size:19px} .sub{display:none}
  .panel{padding:14px 12px;border-radius:10px}
  button{padding:11px 20px;font-size:14.5px}
  .secbtn{padding:10px 14px;font-size:13.5px}
  .summary{gap:6px}
  .summary .badge{font-size:11px;padding:1px 7px}
  .summary button{flex:1 1 auto;min-height:40px}
  .daycard{border-radius:10px}
  .dayhead{flex-wrap:wrap;padding:9px 12px;font-size:13.5px;gap:6px 10px}
  .dayhead span{font-size:11.5px;width:100%}
  .tl{padding:4px 10px 10px}
  .tlrow{flex-wrap:wrap;gap:4px 8px;font-size:13px;padding:7px 0}
  .time{min-width:auto;font-size:12px}
  .poiimg{width:76px;height:52px}
  .swapbtn{margin-left:0;padding:4px 10px;font-size:12px}
  .viol,.drop{margin:0 10px 10px;font-size:12px}
  #amapbox{height:300px!important}
  .note{font-size:12px}
}
.note{color:var(--mut);font-size:12.5px}
.dayreason{padding:0 12px 10px;color:var(--mut);font-size:12.5px;line-height:1.65}
.hint{font-size:12px;color:var(--mut);margin-top:4px}
.swapbtn{background:transparent;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:11px;cursor:pointer;margin-left:auto;flex-shrink:0}
.swapbtn:hover{color:var(--blue);border-color:var(--blue)}
.poiimg{position:relative;width:92px;height:60px;border-radius:8px;border:1px solid var(--line);margin-left:auto;flex-shrink:0;overflow:hidden}
.poiimg img{width:100%;height:100%;object-fit:cover;display:block}
.poiimg .pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-88%);font-size:15px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
</style>
</head>
<body>
<div class="wrap">
<header><h1>🧭 TripAgent</h1><span class="sub">经验提案 → 库内落地 → 求解排程 · 幻觉结构性归零</span><span id="llmbadge"></span></header>

<div class="panel">
  <div><label>旅行需求（纯自然语言：城市、天数、出发日期、住宿都写在需求里）</label>
    <textarea id="query" placeholder="例：10月1日出发，带5岁孩子去杭州玩3天，住西湖国宾馆附近，不要太累，最好有动物或者博物馆"></textarea>
    <div class="hint">天数（「3天」「两日」，最多 5 天）、出发日期（「明天」「下周六」「10月1日」）、住宿（「住外滩附近」「酒店订在全季」）都可直接写在需求里；未提天数默认 2 天，未提城市默认上海。</div>
    <div class="hint" id="citiesHint"></div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="row">
    <button id="go">✨ 生成行程</button><span id="status"></span>
  </div>
</div>

<div id="out"></div>
</div>

<script>
const DAY_COLORS=["#1a5fb4","#1d7a4c","#b7791f","#c0392b","#6b46c1"];
const ICON={poi:"📍",meal:"🍽",hotel:"🏨"};
let CITY={};let LAST=null; // 最近一次规划结果（导出行程单用）
const $=id=>document.getElementById(id);

const SAMPLES=["上海2天经典深度游，喜欢历史文化、寺庙和博物馆","带5岁孩子去杭州玩2天，不要太累，最好有动物或者博物馆","苏杭3天联游，喜欢园林和美食，住西湖国宾馆附近","下周六出发，上海下雨天玩2天，想多安排室内场馆"];

async function boot(){
  const r=await (await fetch("/api/cities")).json();
  CITY.cities=r.cities; CITY.llm=r.llm; CITY.amap_key=r.amap_key||"";
  CITY.staticmap_key=r.staticmap_key||""; // P2-3 静态图缩略
  // P4：目的地支持范围说明（动态取自 /api/cities，扩城无需改文案）
  $("citiesHint").innerHTML="🗺 当前支持的目的地："+r.cities.map(c=>`<b>${c.name}</b>（${c.n_pois} 个景点）`).join("、")+`；暂只支持以上 ${r.cities.length} 城，未提及城市时默认规划 <b>上海</b>。`;
  chip();
  llmBadge();
  // P1-2：?share=<id> → 直接渲染已保存的行程快照
  const sid=new URLSearchParams(location.search).get("share");
  if(sid){
    try{
      const s=await (await fetch("/api/share/"+encodeURIComponent(sid))).json();
      if(s.result){
        $("status").innerHTML='<span class="badge b-blue">🔗 已加载分享的行程</span>';
        render({city_meta:s.city_meta||{pois:{}},result:s.result});
        return;
      }
    }catch(e){/* 回退正常模式 */}
    $("status").innerHTML='<span class="badge b-amber">分享链接无效，已回退正常模式</span>';
  }
}
function llmBadge(){
  if(CITY.llm)$("llmbadge").innerHTML='<span class="badge b-green">LLM 已接入</span>';
  else $("llmbadge").innerHTML='<span class="badge b-amber">未配置 Key → 离线兜底模式</span>';
}
function chip(){
  $("chips").innerHTML=SAMPLES.map(s=>`<span class="chip" data-q="${s}">${s.slice(0,20)}…</span>`).join("");
  document.querySelectorAll(".chip").forEach(el=>el.onclick=()=>{$("query").value=el.dataset.q;});
}

async function doPlan(q){
  const p=new URLSearchParams({query:q,llm:CITY.llm?"1":"0"});
  $("go").disabled=true;
  $("status").innerHTML='<span class="spin"></span>规划中：经验提案 → '+(CITY.llm?"库内落地":"离线兜底")+" → 求解排程 → 修复链…";
  $("out").innerHTML="";
  try{
    const res=await (await fetch("/api/plan?"+p.toString())).json();
    if(!res.ok){$("status").innerHTML='<span class="badge b-red">❌ '+res.error+"</span>";return;}
    $("status").textContent="完成";
    render(res);
  }catch(e){$("status").innerHTML='<span class="badge b-red">请求失败：'+e+"</span>";}
  $("go").disabled=false;
}

// P1 多轮澄清：规划前 LLM 判断需求是否缺失关键信息，需要则先追问一轮
$("go").onclick=async()=>{
  const q=$("query").value.trim()||"上海2天经典深度游";
  $("go").disabled=true;
  if(!CITY.llm){await doPlan(q);return;}
  $("status").innerHTML='<span class="spin"></span>检查需求完整性…';
  try{
    const c=await (await fetch("/api/clarify?"+new URLSearchParams({query:q}).toString())).json();
    if(c.ok&&c.need&&c.question){
      $("status").innerHTML='<span class="badge b-amber">❓ 想先确认一个问题</span>';
      $("out").innerHTML=`<div class="panel"><div style="font-size:15px;margin-bottom:10px">❓ ${c.question}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">${c.options.map(o=>`<span class="chip" data-o="${o}">${o}</span>`).join("")}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <input id="clarifyText" placeholder="或用自己的话补充…" style="flex:1;min-width:200px;padding:8px 10px;border:1px solid #d7dce3;border-radius:8px;font-size:14px">
          <button class="secbtn" id="clarifyGo">带上回答生成</button>
          <button class="secbtn" id="clarifySkip">不用了，直接生成</button>
        </div></div>`;
      document.querySelectorAll("#out .chip[data-o]").forEach(el=>el.onclick=()=>doPlan(q+"。"+el.dataset.o));
      $("clarifyGo").onclick=()=>{const t=$("clarifyText").value.trim();doPlan(t?q+"。"+t:q);};
      $("clarifySkip").onclick=()=>doPlan(q);
      $("go").disabled=false;
      return;
    }
  }catch(e){/* 澄清失败静默降级为直接规划 */}
  await doPlan(q);
};

function render({city_meta,result:r,days_source,parsed}){
  LAST={city_meta,result:r,days_source,parsed}; // P2-1 换点后整体重渲染需要 days_source/parsed
  const it=r.itinerary;
  const closedV=(it.days||[]).flatMap(d=>d.violations||[]).filter(v=>v.reason.startsWith("当日闭馆")).length;
  const retV=(it.days||[]).flatMap(d=>d.violations||[]).filter(v=>v.reason.startsWith("返回酒店")).length;
  // P1-4：闭馆日提示 —— 从剔除记录里汇总「当日闭馆」被正确避开的 POI
  const avoided=(it.dropped_pois||[]).filter(x=>(x.reason||"").includes("当日闭馆"));
  let h=`<div class="panel"><div class="summary">
    <span class="badge b-blue">📍 ${city_meta.name||"未知城市"}</span>
    <span class="badge b-blue">${r.mode==="m2_toptw"?"M2 库内直选+TOPTW":r.mode.startsWith("m7")?"M7 经验提案"+(r.mode==="m7_proposal"?"":"（降级）"):r.mode}</span>
    ${days_source==="query"?`<span class="badge b-green">📅 需求识别 ${r.days} 天</span>`:days_source==="default"?'<span class="badge b-amber">📅 需求未提天数 · 默认 2 天</span>':""}
    ${r.date0?`<span class="badge b-blue" title="已按出发日期启用闭馆日硬约束">📅 ${r.date0} 出发</span>`:'<span class="badge b-amber" title="填写出发日期可自动避开周一闭馆等">📅 未填日期（闭馆约束未启用）</span>'}
    ${r.grounding?`<span class="badge ${r.grounding.grounding_rate>=0.8?"b-green":"b-amber"}">🎯 落地率 ${Math.round(r.grounding.grounding_rate*100)}%</span>`:""}
    ${r.grounding&&r.grounding.gaps.length?`<span class="badge b-amber" title="${r.grounding.gaps.map(g=>g.name).join("、")}">📚 库缺口 ${r.grounding.gaps.length}</span>`:""}
    <span class="badge ${it.total_violations===0?"b-green":"b-red"}">${it.total_violations===0?"✅ 0 硬约束违规":"❌ "+it.total_violations+" 硬约束违规"}</span>
    ${avoided.length?`<span class="badge b-green" title="当日闭馆已自动避开：${avoided.map(x=>x.name).join("、")}">🏛 已避开闭馆 ${avoided.length} 处</span>`:""}
    ${r.hotel?`<span class="badge b-amber">🏨 ${r.hotel.name}</span>`:""}
    ${r.n_dup_across_days===0?'<span class="badge b-green">跨天重复 0</span>':`<span class="badge b-amber">跨天重复 ${r.n_dup_across_days}（已剥除）</span>`}
    ${r.cache_hit?'<span class="badge b-green" title="相同需求 7 天内命中本地缓存，秒回且不消耗 LLM 额度">⚡ 缓存秒回</span>':""}
    <span class="badge b-blue">耗时 ${r.latency_s}s</span>
    ${r.candidates!=null?`<span class="badge b-blue">候选池 ${r.candidates}</span>`:""}
    ${closedV?`<span class="badge b-red">闭馆违规 ${closedV}</span>`:""}
    ${retV?`<span class="badge b-red">返程违规 ${retV}</span>`:""}
    <button id="shareBtn" style="margin-left:auto" onclick="shareDoc()">🔗 分享</button>
    <button id="exportBtn" onclick="openDoc()">📥 导出行程单</button>
    <button class="secbtn" onclick="exportICS()">📅 加入日历</button>
    <button class="secbtn" onclick="exportPNG()">🖼 存长图</button>
  </div>
  <p class="note">「${r.query}」</p>
  <div class="two" style="margin-top:12px"><div class="map" id="map"></div><div id="daycards"></div></div></div>`;
  $("out").innerHTML=h;
  $("daycards").innerHTML=it.days.map(d=>dayCard(d,city_meta)).join("");
  // 地图：优先高德 JS API 真实底图渲染，失败/无 Key 自动回退 SVG 手绘图
  if(CITY.amap_key){
    $("map").innerHTML='<p class="hint" style="padding:12px">🗺 高德地图加载中…</p>';
    renderAMap(city_meta,r).then(ok=>{
      if($("map")&&document.getElementById("amapbox")===null&&$("map").querySelector("svg")===null)
        $("map").innerHTML=drawMap(city_meta,r)+(ok?"":'<p class="hint" style="color:var(--red)">⚠ 高德地图加载失败，已临时用手绘图（可强刷页面后重新生成行程重试）</p>');
    });
  }else{
    $("map").innerHTML=drawMap(city_meta,r);
  }
}

// P3 POI 缩略图：优先 /api/photo 实拍图（302 高德图库直链，成功时隐藏图钉），失败回退公开瓦片（GCJ-02 对齐，无 Key，保留图钉标注位置）
// 点击缩略图 → 地图 zoom 定位到该 POI
function poiThumb(p){
  if(!p)return "";
  const z=15,n=2**z;
  const x=Math.floor((p.lng+180)/360*n);
  const rad=p.lat*Math.PI/180;
  const y=Math.floor((1-Math.log(Math.tan(rad)+1/Math.cos(rad))/Math.PI)/2*n);
  const tile=`https://webrd02.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x=${x}&y=${y}&z=${z}`;
  const src=p.id?`/api/photo?id=${p.id}`:tile;
  const click=p.id?` onclick="focusPoi('${p.id}')" title="点击在地图上定位" style="cursor:pointer"`:"";
  return `<div class="poiimg"${click}><img loading="lazy" alt="" src="${src}" data-tile="${p.id?tile:""}" onload="this.nextElementSibling.style.display='none'" onerror="if(this.dataset.tile){this.onload=null;this.nextElementSibling.style.display='';this.src=this.dataset.tile;this.dataset.tile=''}else{this.parentNode.remove()}"><span class="pin">📍</span></div>`;
}

function dayCard(d,meta){
  const color=DAY_COLORS[(d.day-1)%DAY_COLORS.length];
  const rows=(d.timeline||[]).map(s=>{
    const isPoi=s.type==="poi";
    const p=isPoi&&meta&&meta.pois[s.id];
    const img=isPoi?poiThumb(p):"";
    const swap=isPoi?`<button class="swapbtn" title="不喜欢？换成附近的同类地点" onclick="swapPoi(${d.day},'${s.id}')">🔁 换一个</button>`:"";
    return `<div class="tlrow"><span class="time">${s.start}–${s.end}</span><span>${s.type==="poi"?"":(ICON[s.type]||"")}</span><span style="flex:1">${s.name}</span>${img}${swap}</div>`;
  }).join("");
  const viol=(d.violations&&d.violations.length)?`<div class="viol">⚠️ ${d.violations.map(v=>`${v.poi}：${v.reason}`).join("；")}</div>`:"";
  const drop=(d.dropped&&d.dropped.length)?`<div class="drop">🗑 剔除：${d.dropped.map(x=>`${x.name}（${x.reason}）`).join("；")}</div>`:"";
  return `<div class="daycard"><div class="dayhead" style="background:${color}">Day ${d.day}${d.weekday?`｜${d.weekday}`:""}｜${d.theme||""}<span style="font-weight:400;font-size:12px">交通 ${Math.round(d.travel_km*10)/10}km｜收尾 ${d.finish}</span></div><div class="tl">${rows}</div>${d.reason?`<div class="dayreason">${d.reason}</div>`:""}${viol}${drop}</div>`;
}

function drawMap(meta,r){
  const ps=Object.values(meta.pois);
  if(!ps.length)return "";
  const W=440,H=340,pad=0.03;
  const minLa=Math.min(...ps.map(p=>p.lat)),maxLa=Math.max(...ps.map(p=>p.lat));
  const minLn=Math.min(...ps.map(p=>p.lng)),maxLn=Math.max(...ps.map(p=>p.lng));
  const xy=(lat,lng)=>[ (lng-minLn)/((maxLn-minLn)||1)*(W-56)+38, (1-(lat-minLa)/((maxLa-minLa)||1))*(H-44)+26 ];
  let s=`<svg viewBox="0 0 ${W} ${H}">`;
  const it=r.itinerary||{};
  for(const d of (it.days||[])){
    const color=DAY_COLORS[(d.day-1)%DAY_COLORS.length];
    const pts=(d.timeline||[]).filter(x=>x.type==="poi"&&meta.pois[x.id]).map(x=>xy(meta.pois[x.id].lat,meta.pois[x.id].lng));
    if(pts.length>1)s+=`<polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="${color}" stroke-width="1.6" opacity="0.5" stroke-dasharray="5 3"/>`;
    for(const [x,y] of pts)s+=`<circle cx="${x}" cy="${y}" r="4.5" fill="${color}" stroke="#fff" stroke-width="1.2"/>`;
  }
  if(r.hotel){const [x,y]=xy(r.hotel.lat,r.hotel.lng);
    s+=`<path d="M ${x} ${y-9} L ${x+2.7} ${y-2.7} L ${x+9} ${y-2.7} L ${x+3.9} ${y+1.7} L ${x+5.6} ${y+8.4} L ${x} ${y+4.3} L ${x-5.6} ${y+8.4} L ${x-3.9} ${y+1.7} L ${x-9} ${y-2.7} L ${x-2.7} ${y-2.7} Z" fill="#b7791f" stroke="#fff" stroke-width="1"/>
    <text x="${x+12}" y="${y+4}" font-size="11" fill="#b7791f">🏨</text>`;}
  s+="</svg>";
  return s+`<p class="hint" style="margin-top:6px">🗺 同色 = 同一天动线（虚线为顺序，圆点为 POI，⭐ 为酒店）</p>`;
}

// ===== 高德地图渲染（JS API 1.4.15；失败自动回退 SVG 手绘图） =====
let AMAP_OBJ=null;let MAP_TOKEN=0; // 快速连续规划时防止异步渲染竞态
let DAY_LINES={},DAY_VIS={}; // 按天路线折线引用与显隐状态
let POI_MARKERS={}; // id → {m:marker,name}，供缩略图点击定位
function focusPoi(id){
  const rec=POI_MARKERS[id];
  if(!rec||!AMAP_OBJ)return;
  const pos=rec.m.getPosition();
  AMAP_OBJ.setZoomAndCenter(15,pos); // 街区级视野，兼顾周边参照
  rec.m.setLabel({content:`<div style="padding:2px 8px;font-size:12px">📍 ${rec.name}</div>`,direction:"top",offset:new AMap.Pixel(0,-6)});
  clearTimeout(focusPoi._t);
  focusPoi._t=setTimeout(()=>{try{rec.m.setLabel(null)}catch(e){}},4000);
}
function toggleDayLine(day){
  DAY_VIS[day]=!DAY_VIS[day];
  (DAY_LINES[day]||[]).forEach(l=>DAY_VIS[day]?l.show():l.hide());
  const b=document.querySelector(`#dayfilter button[data-day="${day}"]`);
  if(b)b.style.opacity=DAY_VIS[day]?1:.35;
}
function loadAMap(key){
  if(window.AMap)return Promise.resolve(true);
  if(!key)return Promise.resolve(false);
  return new Promise(res=>{
    const s=document.createElement("script");
    s.src=`https://webapi.amap.com/maps?v=1.4.15&key=${encodeURIComponent(key)}`;
    s.onload=()=>res(!!window.AMap);
    s.onerror=()=>res(false);
    document.head.appendChild(s);
    setTimeout(()=>res(!!window.AMap),10000); // 网络超时兜底
  });
}
async function renderAMap(meta,r){
  const token=++MAP_TOKEN;
  if(!await loadAMap(CITY.amap_key))return false;
  const el=$("map");if(!el||token!==MAP_TOKEN)return true;
  el.innerHTML='<div id="dayfilter" style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;align-items:center"></div><div id="amapbox" style="width:100%;height:480px;border:1px solid var(--line);border-radius:8px;overflow:hidden"></div>';
  let map;
  try{
    if(AMAP_OBJ&&AMAP_OBJ.destroy)AMAP_OBJ.destroy(); // 释放上一张地图
    map=new AMap.Map("amapbox",{zoom:12,mapStyle:"amap://styles/whitesmoke",resizeEnable:true});
    AMAP_OBJ=map;
    POI_MARKERS={}; // 重置须在 marker 创建前（overlays 循环会填充）
    const overlays=[];
    for(const d of (r.itinerary.days||[])){
      const color=DAY_COLORS[(d.day-1)%DAY_COLORS.length];
      const seq=(d.timeline||[]).filter(x=>x.type==="poi"&&meta.pois[x.id]);
      seq.forEach((x,i)=>{
        const p=meta.pois[x.id];
        const m=new AMap.Marker({position:[p.lng,p.lat],anchor:"bottom-center",
          content:`<div style="position:relative;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))"><div style="width:24px;height:24px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:${color};border:2px solid #fff"></div><span style="position:absolute;left:0;top:0;width:24px;height:20px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700">${i+1}</span></div>`});
        m.on("mouseover",()=>m.setLabel({content:`<div style="padding:2px 8px;font-size:12px">📍 Day ${d.day}·${i+1}｜${x.name}</div>`,direction:"top",offset:new AMap.Pixel(0,-6)}));
        m.on("mouseout",()=>m.setLabel(null));
        overlays.push(m);
        POI_MARKERS[x.id]={m,name:x.name}; // 供日卡缩略图点击定位
      });
      // 只画实际交通路线（drawRealRoutes 异步叠加），不再画点位间直线连接
    }
    if(r.hotel){
      overlays.push(new AMap.Marker({position:[r.hotel.lng,r.hotel.lat],anchor:"bottom-center",
        content:`<div style="font-size:22px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))">🏨</div>`}));
    }
    map.add(overlays);
    map.setFitView(null,false,[40,40,40,40]);
    // 瓦片就绪检测：key 类型不对/无效时 complete 永不触发 → 12s 后回退 SVG
    const ok=await Promise.race([
      new Promise(res=>map.on("complete",()=>res(true))),
      new Promise(res=>setTimeout(()=>res(false),12000))
    ]);
    if(!ok){map.destroy();AMAP_OBJ=null;return false;}
    // 按天显隐路线：生成 Day 色块开关（折线引用由 drawRealRoutes 异步挂到 DAY_LINES）
    DAY_LINES={};DAY_VIS={};
    const df=document.getElementById("dayfilter");
    if(df)df.innerHTML=(r.itinerary.days||[]).map(d=>{
      const c=DAY_COLORS[(d.day-1)%DAY_COLORS.length];
      DAY_VIS[d.day]=true;
      return `<button data-day="${d.day}" onclick="toggleDayLine(${d.day})" style="cursor:pointer;border:1px solid ${c};background:${c};color:#fff;border-radius:14px;padding:2px 12px;font-size:12px">Day ${d.day} 路线</button>`;
    }).join("")+'<span style="font-size:12px;color:#888">点击开关各天路线</span>';
    // P1-1：异步绘制实际路网（骑行/步行）；某段失败则该段无线（不画直线兜底）
    drawRealRoutes(map,meta,r,token);
    return true;
  }catch(e){
    try{map&&map.destroy()}catch(_){}
    AMAP_OBJ=null;return false;
  }
}

function routeMode(query){
  return /骑行|骑车|单车|自行车|cycling|bike/i.test(query||"")?"riding":"walking";
}
async function drawRealRoutes(map,meta,r,token){
  if(!CITY.amap_key)return;
  const mode=routeMode(r.query);
  const legs=[];
  for(const d of (r.itinerary.days||[])){
    const color=DAY_COLORS[(d.day-1)%DAY_COLORS.length];
    const pts=[];
    if(r.hotel)pts.push([r.hotel.lng,r.hotel.lat]);
    for(const x of (d.timeline||[]))if(x.type==="poi"&&meta.pois[x.id])pts.push([meta.pois[x.id].lng,meta.pois[x.id].lat]);
    if(r.hotel&&pts.length>1)pts.push([r.hotel.lng,r.hotel.lat]);
    if(pts.length>1)legs.push({day:d.day,color,pts});
  }
  await Promise.all(legs.map(async({day,color,pts})=>{
    for(let i=0;i<pts.length-1;i++){
      let poly=null;
      try{
        const res=await fetch(`/api/route?mode=${mode}&o=${pts[i].join(",")}&d=${pts[i+1].join(",")}`);
        const dd=await res.json();
        if(dd.ok&&dd.points&&dd.points.length>1)poly=dd.points;
      }catch(e){/* 回退直线 */}
      if(token!==MAP_TOKEN)return; // 快速连续规划时放弃过期渲染
      if(poly){
        const line=new AMap.Polyline({path:poly,strokeColor:color,strokeWeight:4.5,strokeOpacity:.9,bubble:true});
        map.add(line);
        (DAY_LINES[day]=DAY_LINES[day]||[]).push(line);
        if(DAY_VIS[day]===false)line.hide(); // 渲染期间用户已关闭该天
      }
    }
  }));
  if(token===MAP_TOKEN)map.setFitView(null,false,[40,40,40,40]);
}

// ===== P0-1 行程导出：ICS 日历 + Canvas 长图 =====
function _icsEsc(s){return (s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");}
function _download(name,blob){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),10000);
}
async function exportICS(){
  if(!LAST)return;
  const r=LAST.result,it=r.itinerary;
  let d0=r.date0;
  if(!d0){ // 无出发日期时询问（ICS 需要锚定日期）
    d0=prompt("行程将写入日历，请输入出发日期（YYYY-MM-DD）：",
      new Date().toISOString().slice(0,10));
    if(!d0)return;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d0)){alert("日期格式应为 YYYY-MM-DD");return;}
  }
  const base=new Date(d0+"T00:00:00");
  const pad=n=>String(n).padStart(2,"0");
  const evs=[];
  (it.days||[]).forEach(d=>{
    const day=new Date(base);day.setDate(day.getDate()+d.day-1);
    const ymd=`${day.getFullYear()}${pad(day.getMonth()+1)}${pad(day.getDate())}`;
    (d.timeline||[]).forEach((s,i)=>{
      const st=(s.start||"09:00").replace(":",""),en=(s.end||s.start||"10:00").replace(":","");
      evs.push(["BEGIN:VEVENT",
        `UID:tripagent-${d.day}-${i}-${ymd}@tripagent.app`,
        `DTSTART:${ymd}T${st}00`,
        `DTEND:${ymd}T${en}00`,
        `SUMMARY:${_icsEsc(`Day${d.day} ${s.name}`)}`,
        `DESCRIPTION:${_icsEsc(`主题：${d.theme||"行程"}｜交通约 ${Math.round(d.travel_km*10)/10}km`+(r.query?`｜需求：${r.query}`:""))}`,
        "END:VEVENT"]);
    });
  });
  const fold=l=>l.length<=73?l:l.slice(0,73)+"\r\n "+l.slice(73);
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//TripAgent//Itinerary//CN","CALSCALE:GREGORIAN",
    ...evs.flat().map(fold),"END:VCALENDAR"].join("\r\n");
  _download(`TripAgent行程-${(LAST.city_meta.name||"trip")}-${d0}.ics`,new Blob([ics],{type:"text/calendar;charset=utf-8"}));
  $("status").innerHTML='<span class="badge b-green">📅 ICS 已下载，导入手机日历即可按时间提醒</span>';
}
function exportPNG(){
  if(!LAST)return;
  const r=LAST.result,it=r.itinerary,meta=LAST.city_meta;
  const W=750,SC=2,colors=DAY_COLORS,m=32,lh=26;
  const c=document.createElement("canvas");
  const x2=c.getContext("2d");
  x2.font='13px "Microsoft YaHei",sans-serif';
  const wrap=(txt,max)=>{const out=[];let line="";for(const ch of txt){if(x2.measureText(line+ch).width>max){out.push(line);line=ch;}else line+=ch;}if(line)out.push(line);return out;};
  // 预计算高度
  let H=150;
  (it.days||[]).forEach(d=>{
    H+=44+8+(d.timeline||[]).length*(lh+10)+18;
    if(d.reason){x2.font='12px "Microsoft YaHei",sans-serif';H+=wrap(d.reason,W-2*m).length*19+6;}
    (d.violations||[]).forEach(()=>H+=20);
  });
  H+=56;
  c.width=W*SC;c.height=H*SC;x2.scale(SC,SC);
  const bg="#f7f8fa";x2.fillStyle=bg;x2.fillRect(0,0,W,H);
  // 头部
  x2.fillStyle="#1a5fb4";x2.font='600 26px "Microsoft YaHei",sans-serif';
  x2.fillText("🧭 TripAgent 行程单",m,52);
  x2.fillStyle="#52606d";x2.font='13px "Microsoft YaHei",sans-serif';
  const head=[`目的地：${meta.name||""}｜${(it.days||[]).length} 天${r.date0?`｜${r.date0} 出发`:""}${r.hotel?`｜住宿：${r.hotel.name}`:""}`,
    `需求：${r.query||""}`].map(t=>wrap(t,W-2*m)).flat();
  head.forEach((t,i)=>x2.fillText(t,m,84+i*22));
  let y=110+head.length*22;
  // 日卡
  (it.days||[]).forEach(d=>{
    const col=colors[(d.day-1)%colors.length];
    x2.fillStyle=col;x2.font='600 17px "Microsoft YaHei",sans-serif';
    const ht=`Day ${d.day}${d.weekday?"｜"+d.weekday:""}｜${d.theme||""}`;
    const km=`交通 ${Math.round(d.travel_km*10)/10}km｜收尾 ${d.finish}`;
    x2.fillText(ht,m,y+24);
    x2.font='12px "Microsoft YaHei",sans-serif';x2.fillStyle="#ffffffcc";
    const kw=x2.measureText(km).width;
    x2.fillText(km,W-m-kw,y+24);
    y+=44+8;
    (d.timeline||[]).forEach(s=>{
      x2.fillStyle="#52606d";x2.font='12.5px "Microsoft YaHei",sans-serif';
      x2.fillText(`${s.start}–${s.end}`,m,y+16);
      x2.fillStyle="#1f2933";x2.font='13.5px "Microsoft YaHei",sans-serif';
      const nm=s.name+(s.type==="meal"?" 🍽":s.type==="hotel"?" 🏨":"");
      wrap(nm,W-2*m-120).forEach((t,i)=>x2.fillText(t,m+110,y+16+i*18));
      y+=lh+10+Math.max(0,(wrap(nm,W-2*m-120).length-1))*18;
      x2.strokeStyle="#e4e7eb";x2.lineWidth=0.5;
      x2.beginPath();x2.moveTo(m+104,y-2);x2.lineTo(W-m,y-2);x2.stroke();
    });
    if(d.reason){
      x2.fillStyle="#6b7280";x2.font='12px "Microsoft YaHei",sans-serif';
      wrap(d.reason,W-2*m).forEach(t=>{x2.fillText(t,m,y+14);y+=19;});
      y+=6;
    }
    (d.violations||[]).forEach(v=>{
      x2.fillStyle="#c0392b";x2.font='12px "Microsoft YaHei",sans-serif';
      wrap(`⚠ ${v.poi}：${v.reason}`,W-2*m).forEach(t=>{x2.fillText(t,m,y+14);y+=20;});
    });
    y+=18;
  });
  x2.fillStyle="#888780";x2.font='11.5px "Microsoft YaHei",sans-serif';
  x2.fillText("由 TripAgent 生成 · 检索 → LLM 库内选择 → 优化求解（时间为估算，出发前请确认开放情况）",m,H-24);
  c.toBlob(b=>{_download(`TripAgent行程-${meta.name||""}.png`,b);},"image/png");
  $("status").innerHTML='<span class="badge b-green">🖼 长图已保存到下载目录</span>';
}

// P2-1 反馈闭环：不喜欢某点 → 同类目邻近换点并重排当天
async function swapPoi(day,poiId){
  if(!LAST)return;
  const it=LAST.result.itinerary;
  const d=it.days.find(x=>x.day===day);
  if(!d)return;
  const dayIds=(d.timeline||[]).filter(s=>s.type==="poi").map(s=>s.id);
  const usedIds=it.days.flatMap(x=>(x.timeline||[]).filter(s=>s.type==="poi").map(s=>s.id));
  let city=(LAST.parsed&&LAST.parsed.city)||LAST.city_meta.name||"上海"; // P4 纯自然语言：来自需求识别结果
  const pre=(d.theme||"").split("｜")[0].trim(); // 多城联游时主题带城市前缀
  if(LAST.result.cities&&LAST.result.cities.includes(pre))city=pre;
  $("status").innerHTML='<span class="spin"></span>换点中…';
  try{
    const res=await fetch("/api/replace",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({city,day,poi_id:poiId,day_ids:dayIds,used_ids:usedIds,
        query:LAST.result.query,date0:LAST.result.date0||null,
        hotel_text:LAST.result.hotel?LAST.result.hotel.name:""})});
    const r=await res.json();
    if(r.ok){
      Object.assign(d,r.day); // timeline/travel_km/finish/violations/dropped/weekday 全量更新
      $("status").innerHTML=`<span class="badge b-green">🔁 ${r.swap.from} → ${r.swap.to}${r.swap.same_category?"（同类目）":"（就近）"}</span>`;
      render(LAST);
    }else{
      $("status").innerHTML='<span class="badge b-red">换点失败：'+(r.error||"")+"</span>";
    }
  }catch(e){
    $("status").innerHTML='<span class="badge b-red">换点失败：'+e+"</span>";
  }
}

        :`<span class="badge b-green">🔗 分享链接：</span><a href="${url}" target="_blank">${url}</a>`;
    }else{
      $("status").innerHTML='<span class="badge b-red">分享失败：'+(d.error||"未知错误")+"</span>";
    }
  }catch(e){
    $("status").innerHTML='<span class="badge b-red">分享失败：'+e+"</span>";
  }
  btn.disabled=false;btn.textContent="🔗 分享";
}

boot();
</script>
</body>
</html>
