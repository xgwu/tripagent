name: release-gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install -r requirements.txt 2>/dev/null || pip install ortools
      - name: Release gate (unit tests + regression + city db validation)
        run: python scripts/release_gate.py
